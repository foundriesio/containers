version: "3.9"

services:
  arduino-elf-webui:
    image: hub.foundries.io/${FACTORY}/arduino-elf-webui:latest
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    stdin_open: true     # -i
    tty: true            # -t
    devices:
      - "/dev/video0:/dev/video0"
    volumes:
      - /var/local/assets:/var/local/assets
      - /etc/localtime:/etc/localtime:ro
    environment:
        DEBUG: "0"
