<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Object Detection - Elf on the Shelf</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root{
            --bg1:#071226; --bg2:#0b1a2b;
            --panel:#0b1220;
            --text:#e6eef8; --muted:#9fb0c8;
            --accent:#020b3f;
            --accent-rgb:2,11,63;
            --glow: rgba(var(--accent-rgb), .28);
            --tile-shadow:0 10px 28px rgba(0,0,0,.45);
            --gap:16px;
        }
        html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
        .container{max-width:1200px;margin:30px auto;padding:20px}

        /* Top white header */
        .header-top{background:#ffffff;border-radius:12px;padding:18px;margin-bottom:24px;box-shadow:0 10px 30px rgba(2,6,23,0.45);text-align:center}
        .header-top h1{margin:0;color:#020b3f;font-size:32px;font-weight:800}
        .header-top p{margin:8px 0 0 0;color:#4a5568;font-size:16px}

        /* Video Container */
        .video-container{background:rgba(255,255,255,0.03);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,0.3);margin:20px 0;position:relative;min-height:480px;display:flex;align-items:center;justify-content:center}
        #videoStream{width:100%;height:auto;border-radius:8px;display:block;background:#000}
        .loading{position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);color:var(--text);font-size:1.2em;text-align:center}
        .spinner{border:4px solid rgba(255,255,255,0.3);border-top:4px solid #fff;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:0 auto 20px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

        /* Responsive */
        @media (max-width:768px){
            .header-top h1{font-size:24px}
            .header-top p{font-size:14px}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>🎄 Elf on the Shelf Detector</h1>
            <p>Real-time object detection using Edge Impulse AI</p>
        </div>

        <div class="video-container">
            <img id="videoStream" src="" alt="Live camera feed" style="display:none;">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Initializing camera...</div>
            </div>
        </div>
    </div>

    <script>
        const eventSource = new EventSource('/status');

        // SSE Connection
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            // Status updates handled silently
        };

        eventSource.onerror = function() {
            console.log('SSE connection error, reconnecting...');
        };

        // Auto-start camera on load
        function startCamera() {
            fetch('/camera/start', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('videoStream').src = '/video_feed?' + new Date().getTime();
                        document.getElementById('videoStream').style.display = 'block';
                        document.getElementById('loading').style.display = 'none';
                    }
                })
                .catch(err => {
                    console.error('Failed to start camera:', err);
                    document.getElementById('loading').innerHTML = '<div>❌ Camera not available</div>';
                });
        }

        window.addEventListener('load', () => {
            setTimeout(() => startCamera(), 500);
        });
    </script>
</body>
</html>
