version: "3.9"

services:
  arduino-elf-mqtt:
    image: hub.foundries.io/${FACTORY}/arduino-elf-mqtt:latest
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    stdin_open: true     # -i
    tty: true            # -t
    environment:
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_USER=foundries.io
      - MQTT_PASS=foundries.io
      - DEBUG=0
    devices:
      - "/dev/video0:/dev/video0"
    volumes:
      - /var/local/assets:/var/local/assets
      - /etc/localtime:/etc/localtime:ro
