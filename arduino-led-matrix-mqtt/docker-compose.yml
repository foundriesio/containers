version: "3.9"

services:
  arduino-led-matrix-mqtt:
    image: hub.foundries.io/${FACTORY}/arduino-led-matrix-mqtt:latest
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    stdin_open: true     # -i
    tty: true            # -t
    environment:
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_USER=foundries.io
      - MQTT_PASS=foundries.io
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip1:/dev/gpiochip1"
      - "/dev/gpiochip2:/dev/gpiochip2"
    volumes:
      - /var/run/arduino-router.sock:/var/run/arduino-router.sock
      - /opt/openocd:/opt/openocd:ro
      - /etc/localtime:/etc/localtime:ro
